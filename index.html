<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Skin Health Demo</title>

    <style>
        /* Basic styling for the page layout */
        body {
            font-family: system-ui, sans-serif;
            background: #111;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem 3rem;
            gap: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: #1b1b1b;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            flex: 1 1 320px;
            max-width: 520px;
        }

        /* Webcam video area */
        video {
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            border: 2px solid #444;
            background: #000;
        }

        /* Buttons */
        button {
            background: #00b894;
            color: #0b0b0b;
            border: none;
            padding: 0.6rem 1.3rem;
            margin: 0.3rem;
            border-radius: 999px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
        }

        button:hover {
            background: #00d8aa;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #status {
            min-height: 1.3rem;
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.4rem;
        }

        /* Text output area */
        #results {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-top: 1rem; /* gap below the image */
        }

        #annotatedImage {
            margin-top: 0.5rem;
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #444;
            display: none; /* hidden until we have something */
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #bbb;
            margin-bottom: 0.3rem;
        }

        small {
            opacity: 0.7;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>Skin Health Demo</h1>
    <small>(Educational only – not medical advice)</small>

    <div class="container">
        <!-- Left card: webcam + controls -->
        <div class="card">
            <div class="label">Webcam</div>
            <video id="webcam" autoplay playsinline></video>

            <!-- Buttons to control webcam -->
            <div style="margin-top:1rem;">
                <button id="startBtn">Start Webcam</button>
                <button id="stopBtn">Stop Webcam</button>
                <button id="captureBtn">Capture &amp; Analyze</button>
            </div>

            <!-- Status text area -->
            <div id="status"></div>

            <!-- hidden canvas to grab a frame from the video -->
            <canvas id="snapshot" width="480" height="360" style="display:none;"></canvas>
        </div>

        <!-- Right card: annotated image FIRST, then text -->
        <div class="card">
            <div class="label">Analysis</div>

            <!-- annotated YOLO image at the top -->
            <img id="annotatedImage" alt="Annotated detection result">

            <!-- markdown-rendered detections + GPT routine below the image -->
            <div id="results"></div>
        </div>
    </div>

    <!-- Markdown parser (Marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // Get HTML elements
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');
        const statusText = document.getElementById('status');
        const canvas = document.getElementById('snapshot');
        const resultsDiv = document.getElementById('results');
        const annotatedImg = document.getElementById('annotatedImage');

        // Variable to store webcam stream
        let stream = null;

        // Function: Start webcam and show it in <video>
        async function startWebcam() {
            // Check if browser supports camera access
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusText.textContent = 'getUserMedia is not supported in this browser.';
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusText.textContent = 'Webcam started.';
            } catch (err) {
                console.error(err);
                statusText.textContent = 'Error starting webcam: ' + err.message;
            }
        }

        // Function: Stop webcam
        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                statusText.textContent = 'Webcam stopped.';
            }
        }

        // Function: Capture current frame and send to backend
        async function captureAndAnalyze() {
            if (!stream) {
                statusText.textContent = 'Please start the webcam first.';
                return;
            }

            // Draw current frame to the canvas
            const width = video.videoWidth || 480;
            const height = video.videoHeight || 360;
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);

            statusText.textContent = 'Capturing frame and sending to server...';
            resultsDiv.innerHTML = '';
            annotatedImg.style.display = 'none';

            // Convert canvas to a blob (PNG) and send via FormData
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    statusText.textContent = 'Could not capture image from webcam.';
                    return;
                }

                const formData = new FormData();
                formData.append('file', blob, 'snapshot.png');

                try {
                    const response = await fetch('http://127.0.0.1:8000/analyze', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const detail = errorData.detail || response.statusText;
                        statusText.textContent = 'Server error: ' + detail;
                        return;
                    }

                    const data = await response.json();
                    statusText.textContent = 'Analysis complete.';

                    // Build detection markdown (bullet list)
                    const detectionLines = (data.detections || []).map(d =>
                        `- ${d.label} (confidence ${d.confidence.toFixed(2)})`
                    );

                    const detectionText = detectionLines.length
                        ? `**Detected issues:**\n\n${detectionLines.join('\n')}`
                        : 'No specific issues detected by the model.';

                    const routineText = data.gpt_routine || '';

                    // Combine detections + GPT routine as markdown
                    const combinedMarkdown = detectionText + '\n\n' + routineText;

                    // Render markdown to HTML
                    resultsDiv.innerHTML = marked.parse(combinedMarkdown);

                    // Show annotated image if present (this is now at the top)
                    if (data.annotated_image) {
                        annotatedImg.src = `data:image/png;base64,${data.annotated_image}`;
                        annotatedImg.style.display = 'block';
                    } else {
                        annotatedImg.style.display = 'none';
                    }

                } catch (err) {
                    console.error(err);
                    statusText.textContent = 'Error contacting server: ' + err.message;
                }
            }, 'image/png');
        }

        // Button click listeners
        startBtn.addEventListener('click', startWebcam);
        stopBtn.addEventListener('click', stopWebcam);
        captureBtn.addEventListener('click', captureAndAnalyze);
    </script>

</body>
</html>
