<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Page Title -->
    <title>Skin Health Demo</title>

    <style>
        /* Basic styling for the page layout */
        body {
            font-family: system-ui, sans-serif;
            background: #111;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1rem;
        }

        /* Webcam video area */
        video {
            width: 480px;
            max-width: 90vw;
            border-radius: 12px;
            border: 2px solid #444;
            background: #000;
        }

        /* Buttons for starting/stopping camera */
        button {
            padding: 0.5rem 1rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Start button color */
        #startBtn { background: #22c55e; }

        /* Stop button color */
        #stopBtn { background: #ef4444; color: #fff; }

        /* Status text under the buttons */
        #status {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- Page Header -->
    <h1>Skin Health Demo</h1>

    <!-- Video element where the webcam stream will display -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Buttons to control webcam -->
    <div>
        <button id="startBtn">Start Webcam</button>
        <button id="stopBtn">Stop Webcam</button>
    </div>


    <script>
        // Get HTML elements
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status');

        // Variable to store webcam stream
        let stream = null;

        // Function: Start webcam and show it in <video>
        async function startWebcam() {
            // Check if browser supports camera access
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusText.textContent = 'getUserMedia is not supported in this browser.';
                return;
            }

            try {
                // Ask for permission to access the webcam
                stream = await navigator.mediaDevices.getUserMedia({ video: true });

                // Connect the video stream to the <video> element
                video.srcObject = stream;

                // Update status text
                statusText.textContent = 'Webcam is running.';
            } catch (err) {
                // Display error if permission denied or webcam not available
                statusText.textContent = 'Could not access webcam: ' + err.message;
            }
        }

        // Function: Stop webcam properly
        function stopWebcam() {
            if (stream) {
                // Stop all tracks (camera turns off)
                stream.getTracks().forEach(track => track.stop());

                // Remove stream from <video>
                video.srcObject = null;
                stream = null;

                // Update text
                statusText.textContent = 'Webcam stopped.';
            }
        }

        // Button click listeners
        startBtn.addEventListener('click', startWebcam);
        stopBtn.addEventListener('click', stopWebcam);
    </script>

</body>
</html>
